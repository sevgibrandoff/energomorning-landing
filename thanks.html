<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спасибо за оплату</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'Dance Partner';
  src:url(data:font/ttf;base64,PASTE_DANCE_PARTNER_FONT_BASE64_HERE) format('truetype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
:root{
  --cream:#F7F1E8;
  --cream-light:#FBF7F1;
  --beige:#E9DCC8;
  --beige-dark:#D8C4A5;
  --brown:#6B4A34;
  --brown-dark:#4A3223;
  --choco:#3B2A1F;
  --text:#3B2E24;
  --text-muted:#8A7A68;
  --accent:#A9723F;
  --accent-dark:#8A5A31;
  --white:#FFFFFF;
  --radius:20px;
  --shadow: 0 16px 36px -18px rgba(59,42,31,0.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Montserrat',Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.55;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Dance Partner','Montserrat',Georgia,serif;
  font-weight:700;
  text-shadow:0.4px 0 currentColor, -0.4px 0 currentColor, 0 0.4px currentColor, 0 -0.4px currentColor;
  letter-spacing:0.01em;
  color:var(--choco);
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.container{
  max-width:1120px;
  margin:0 auto;
  padding:0 24px;
}
.section{padding:52px 0;}
.eyebrow{
  display:inline-block;
  font-family:'Montserrat',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.13em;
  text-transform:uppercase;
  color:var(--accent-dark);
  background:var(--beige);
  padding:6px 16px;
  border-radius:999px;
  margin-bottom:14px;
}
.h2{
  font-size:clamp(28px,4vw,40px);
  line-height:1.1;
  margin-bottom:12px;
  font-weight:800;
}
.lead{
  font-size:16.5px;
  color:var(--text-muted);
  max-width:620px;
}
.center{text-align:center;margin-left:auto;margin-right:auto;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--choco);
  color:var(--cream-light);
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:16px;
  padding:16px 36px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  box-shadow:0 12px 26px -10px rgba(59,42,31,0.45);
}
.btn:hover{transform:translateY(-2px);background:var(--brown-dark);}
.btn-lg{padding:18px 44px;font-size:17px;}

/* HEADER */
.site-header{
  background:var(--white);
  border-bottom:1px solid var(--beige);
  position:sticky;
  top:0;
  z-index:50;
}
.site-header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:14px 24px;
}
.site-logo{
  font-family:'Dance Partner','Montserrat',Georgia,serif;
  font-weight:700;
  font-size:20px;
  color:var(--choco);
  white-space:nowrap;
}
.site-nav{
  display:flex;
  gap:24px;
  flex:1;
  justify-content:center;
  flex-wrap:wrap;
}
.site-nav a{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:14.5px;
  color:var(--brown-dark);
  white-space:nowrap;
}
.site-nav a:hover{color:var(--accent-dark);}
@media(max-width:800px){
  .site-header-inner{
    flex-wrap:nowrap;
    justify-content:flex-start;
    padding:12px 16px;
    gap:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .site-header-inner::-webkit-scrollbar{display:none;}
  .site-logo{font-size:15px;}
  .site-nav{
    flex:none;
    gap:14px;
    justify-content:flex-start;
    flex-wrap:nowrap;
  }
  .site-nav a{font-size:13px;}
}

/* HERO */
.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#F3E9DA 0%, var(--cream) 65%);
  padding:36px 0 0;
}
.hero-inner{
  display:grid;
  grid-template-columns:1.05fr 0.95fr;
  gap:36px;
  align-items:center;
}
.hero-text .eyebrow{background:var(--white);}
.hero-title{
  font-size:clamp(30px,4.6vw,48px);
  line-height:1.08;
  margin-bottom:14px;
}
.hero-title span{color:var(--accent-dark);}
.hero-sub{
  font-size:18px;
  color:var(--brown-dark);
  margin-bottom:10px;
  font-weight:600;
}
.hero-desc{
  font-size:16px;
  color:var(--text-muted);
  max-width:520px;
  margin-bottom:22px;
}
.hero-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:24px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--white);
  border:1px solid var(--beige-dark);
  padding:8px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  color:var(--brown-dark);
}
.hero-photo-wrap{
  position:relative;
  border-radius:26px;
  overflow:hidden;
  aspect-ratio:4/5;
  box-shadow:var(--shadow);
}
.hero-photo-wrap img{width:100%;height:100%;object-fit:cover;}

/* FOR YOU */
.for-you{background:var(--white);}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}
.check-list{list-style:none;margin-top:16px;}
.check-list li{
  display:flex;
  gap:14px;
  padding:13px 0;
  border-bottom:1px solid var(--beige);
  font-size:15.5px;
  color:var(--text);
}
.check-list li:last-child{border-bottom:none;}
.check-ico{
  flex-shrink:0;
  width:28px;height:28px;
  border-radius:50%;
  background:var(--beige);
  color:var(--brown-dark);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
}
.side-photo{
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.side-photo img{width:100%;object-fit:cover;}
.for-you-flip .side-photo{max-height:420px;}
.for-you-flip .side-photo img{height:100%;}

/* CONTRAST */
.contrast{
  background:var(--choco);
  color:var(--cream-light);
}
.contrast .eyebrow{background:rgba(255,255,255,0.12);color:#E9C9A0;}
.contrast h2{color:var(--cream-light);}
.no-work-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:24px 0 32px;
}
.no-work-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:18px 16px;
  text-align:center;
}
.no-work-card .x{
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(217,140,110,0.18);
  color:#E9967A;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
  margin:0 auto 10px;
}
.no-work-card p{font-size:14.5px;color:#E8DFD3;font-weight:600;}
.why-box{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:28px;
  border-left:3px solid var(--accent);
}
.why-box h3{color:#E9C9A0;font-size:19px;margin-bottom:10px;font-family:'Montserrat';font-weight:700;}
.why-list{list-style:none;margin-top:14px;display:grid;gap:12px;}
.why-list li{
  display:flex;gap:12px;
  color:#DCD3C6;
  font-size:14.5px;
  line-height:1.55;
}
.why-list b{color:var(--cream-light);}
.why-num{
  flex-shrink:0;
  font-family:'Dance Partner',serif;
  font-size:20px;
  color:var(--accent);
}

/* GOOD NEWS */
.good-news{
  background:linear-gradient(135deg,#EFE1CC 0%, var(--cream) 100%);
  text-align:center;
  padding:44px 0;
}
.good-news .eyebrow{background:var(--white);}
.good-news h2{max-width:760px;margin-left:auto;margin-right:auto;}
.good-news p{max-width:620px;margin:0 auto 6px;color:var(--brown-dark);font-size:16.5px;}

/* PROGRAM */
.program{background:var(--white);}
.timeline{
  display:grid;
  gap:14px;
  margin-top:28px;
}
.timeline-item{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:24px;
  background:var(--cream-light);
  border:1px solid var(--beige);
  border-radius:20px;
  padding:24px 28px;
  align-items:start;
}
.timeline-days{
  font-family:'Montserrat',sans-serif;
  font-size:13px;
  color:var(--accent-dark);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.timeline-days .num{
  display:block;
  font-family:'Dance Partner',serif;
  font-size:32px;
  color:var(--choco);
  font-weight:400;
  line-height:1;
  margin-bottom:2px;
  text-transform:none;
  letter-spacing:0;
}
.timeline-item h3{font-family:'Montserrat';font-weight:700;font-size:17px;margin-bottom:6px;}
.timeline-item p.desc{font-size:14.5px;color:var(--text-muted);}
.timeline-item .result{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--beige-dark);
  font-size:14px;
  color:var(--text-muted);
}
.timeline-item .result b{color:var(--accent-dark);}

/* ABOUT MENTOR */
.about-mentor{background:var(--choco);color:var(--cream-light);}
.about-mentor .eyebrow{background:rgba(255,255,255,0.12);color:#E9C9A0;}
.mentor-grid{
  display:grid;
  grid-template-columns:0.85fr 1.15fr;
  gap:36px;
  align-items:center;
  margin-top:8px;
}
.mentor-photo{
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 20px 44px -20px rgba(0,0,0,0.5);
  aspect-ratio:3/4;
}
.mentor-photo img{width:100%;height:100%;object-fit:cover;object-position:20% 15%;}
.mentor-name{
  font-family:'Dance Partner',serif;
  font-size:34px;
  color:var(--cream-light);
  margin-bottom:16px;
}
.mentor-facts{list-style:none;display:grid;gap:14px;margin-bottom:22px;}
.mentor-facts li{
  display:flex;
  gap:14px;
  align-items:flex-start;
  font-size:15px;
  color:#E4DACB;
  line-height:1.5;
}
.mentor-arrow{
  flex-shrink:0;
  width:30px;height:30px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  color:#E9C9A0;
  margin-top:2px;
}
.mentor-quote{
  background:rgba(255,255,255,0.07);
  border-radius:18px;
  padding:22px 24px;
  font-size:14.5px;
  line-height:1.65;
  color:#E4DACB;
  font-style:italic;
  position:relative;
}
.mentor-quote::before{
  content:"\201C";
  font-family:Georgia,serif;
  font-size:52px;
  color:rgba(255,255,255,0.25);
  position:absolute;
  top:-6px;left:16px;
  font-style:normal;
}

/* UNIQUE */
.unique{background:var(--cream);}
.unique-cards{display:grid;gap:14px;margin-top:24px;}
.unique-card{
  background:var(--white);
  border:1px solid var(--beige);
  border-radius:18px;
  padding:20px 24px;
}
.unique-card h3{font-family:'Montserrat';font-weight:700;font-size:16.5px;margin-bottom:6px;}
.unique-card p{color:var(--text-muted);font-size:14.5px;}

/* REVIEWS */
.reviews{background:var(--white);}
.reviews-grid{
  columns:4 250px;
  column-gap:16px;
  margin-top:24px;
}
.review-card{
  break-inside:avoid;
  margin-bottom:16px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 28px -16px rgba(59,42,31,0.35);
  border:1px solid var(--beige);
  background:var(--cream-light);
}
.review-card img{width:100%;display:block;}

/* ORGANIZATION */
.organization{
  background:var(--cream-light);
}
.organization h2, .organization .eyebrow{color:var(--choco);}
.organization .eyebrow{background:var(--beige);}
.steps{
  display:grid;
  gap:0;
  margin-top:24px;
}
.step{
  display:grid;
  grid-template-columns:44px 1fr;
  gap:18px;
  align-items:start;
  padding:16px 0;
  border-bottom:1px solid var(--beige);
}
.step:last-child{border-bottom:none;}
.step-num{
  width:44px;height:44px;
  border-radius:50%;
  background:var(--white);
  border:1px solid var(--beige-dark);
  display:flex;align-items:center;justify-content:center;
  font-family:'Dance Partner',serif;
  font-size:18px;
  color:var(--accent-dark);
  flex-shrink:0;
}
.step p{font-size:15px;color:var(--text);padding-top:9px;}

/* PRICING */
.pricing{
  background:linear-gradient(180deg,var(--cream) 0%,#EFE1CC 100%);
}
.price-card{
  max-width:600px;
  margin:28px auto 0;
  background:var(--white);
  border-radius:28px;
  padding:32px 32px 24px;
  text-align:center;
  box-shadow:var(--shadow);
  border:1px solid var(--beige);
  position:relative;
}
.price-tag{
  position:absolute;
  top:-15px;left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:var(--white);
  font-family:'Montserrat';
  font-size:14px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  padding:9px 20px;
  border-radius:999px;
  white-space:nowrap;
}
.price-old{
  font-size:20px;
  color:var(--text-muted);
  text-decoration:line-through;
  margin-top:14px;
}
.price-new{
  font-family:'Dance Partner',serif;
  font-size:54px;
  color:var(--choco);
  font-weight:400;
  margin:2px 0 2px;
}
.price-note{
  font-size:14px;
  color:var(--accent-dark);
  font-weight:700;
  margin-bottom:12px;
}
.price-card .btn{width:100%;margin-bottom:14px;}
.price-card-btn{background:#1FA45C;border:none;}
.price-methods{
  font-size:13px;
  color:var(--text-muted);
}

/* FAQ */
.faq{background:var(--white);}
.faq-list{max-width:800px;margin:24px auto 0;}
details{
  border-bottom:1px solid var(--beige);
  padding:16px 0;
}
details summary{
  cursor:pointer;
  font-family:'Montserrat';
  font-size:16px;
  font-weight:600;
  color:var(--choco);
  list-style:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
details summary::-webkit-details-marker{display:none;}
details summary::after{
  content:"+";
  font-size:22px;
  color:var(--accent-dark);
  flex-shrink:0;
  transition:transform .2s ease;
}
details[open] summary::after{transform:rotate(45deg);}
details p{
  margin-top:10px;
  color:var(--text-muted);
  font-size:14.5px;
  padding-right:40px;
}

/* FINAL CTA */
.final-cta{
  background:var(--choco);
  color:var(--cream-light);
  text-align:center;
  padding:52px 0;
}
.final-cta h2{color:var(--cream-light);}
.final-cta p{color:#D8CCBC;font-size:16px;max-width:540px;margin:0 auto 24px;}

/* FOOTER */
footer{
  background:#2C1F16;
  color:#C8B79E;
  padding:32px 0 22px;
  font-size:13px;
  line-height:1.65;
}
.footer-inner{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:18px;
}
footer a{color:#E9C9A0;border-bottom:1px solid rgba(233,201,160,0.35);}
footer a:hover{border-bottom-color:#E9C9A0;}
.footer-links{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}

@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;}
  .hero-photo-wrap{order:-1;aspect-ratio:1/1;max-width:380px;margin:0 auto;}
  .grid-2{grid-template-columns:1fr;}
  .grid-2.reverse .side-photo{order:-1;max-width:380px;margin:0 auto;}
  .no-work-grid{grid-template-columns:1fr;}
  .mentor-grid{grid-template-columns:1fr;}
  .mentor-photo{max-width:340px;margin:0 auto;}
  .timeline-item{grid-template-columns:1fr;gap:8px;}
  .reviews-grid{columns:2 190px;}
  .section{padding:40px 0;}
  .price-card{padding:32px 22px 26px;}
  .price-new{font-size:42px;}
  .footer-inner{flex-direction:column;}
  .footer-links{align-items:flex-start;}
}
@media (max-width:560px){
  .reviews-grid{columns:1;}
  body{font-size:15px;}
}
</style>
